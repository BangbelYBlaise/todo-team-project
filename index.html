<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo Team Project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="todo-container">
        <h1>ToDo List</h1>
        
        <div class="input-section">
            <input type="text" id="taskInput" placeholder="Ajouter une tâche...">
            <button id="addTaskBtn">Ajouter</button>
        </div>

        <ul id="taskList"></ul>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const taskInput = document.getElementById('taskInput');
            const addTaskBtn = document.getElementById('addTaskBtn');
            const taskList = document.getElementById('taskList');

            if (addTaskBtn) {
                addTaskBtn.addEventListener('click', function() {
                    const taskText = taskInput.value.trim();
                    if (taskText !== "") {
                        const li = document.createElement('li');
                        li.innerHTML = `
                            <span>${taskText}</span>
                            <button class="delete-btn" style="background-color: #dc3545; color: white; border: none; padding: 5px 10px; cursor: pointer; margin-left: 10px;">Supprimer</button>
                        `;
                        li.querySelector('.delete-btn').addEventListener('click', function() {
                            li.remove();
                        });
                        taskList.appendChild(li);
                        taskInput.value = "";
                    } else {
                        alert("Veuillez saisir une tâche !");
                    }
                });
            }
        });
    </script>
</body>
</html>
